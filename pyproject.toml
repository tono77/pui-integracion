[project]
name = "pui-integracion"
version = "0.1.0"
description = "Servicio de integración con la Plataforma Única de Identidad (PUI) - institución diversa"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "cryptography>=42",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[tool.pytest.ini_options]
pythonpath = ["."]
